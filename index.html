<title>Veritan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --nav-h: 58px; --safe-b: env(safe-area-inset-bottom, 0px); --ink: #1a1a1a; --acc: #FEDC39; --line: #e6e6e2; --bg: #f4f4f0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: calc(var(--nav-h) + var(--safe-b) + 28px); overscroll-behavior-y: contain; }
  body.gated { padding-bottom: 30px; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--ink); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top .brand { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .top .brand b { color: var(--acc); }
  .top .tname { font-size: 14px; font-weight: 800; color: rgba(255,255,255,.85); }
  .top button { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 9999px; min-width: 40px; height: 36px; padding: 0 12px; font-size: 15px; font-family: inherit; font-weight: 700; }
  .age { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 2px; }
  .age.warn { color: #ffb86b; }
  .wrap { padding: 14px 14px 0; max-width: 620px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #ebebe7; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .card .ttl { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
  .card .meta { font-size: 12.5px; color: #777; margin-top: 5px; line-height: 1.6; word-break: break-word; }
  .card .meta a { color: #0a6e8a; text-decoration: none; font-weight: 700; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .b { flex: 1; border: none; border-radius: 10px; padding: 12px 8px; font-size: 14px; font-weight: 800; font-family: inherit; min-height: 44px; }
  .b-done { background: #e8f5ee; color: #1a8a55; }
  .b-fail { background: #fdecec; color: #c62828; }
  .b-edit { background: #f0f0ec; color: #444; flex: 0 0 52px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 9999px; padding: 3px 10px; margin: 0 4px 6px 0; }
  .bg-in { background: #e8f5ee; color: #1a8a55; }
  .bg-out { background: #fdecec; color: #c62828; }
  .bg-unk { background: #fff4e0; color: #b46b00; }
  .bg-done { background: #f0f0ec; color: #999; }
  /* Статусы заказов — те же цвета, что в редакторе (шкала «насколько требует
     тебя сейчас»); отдельные классы, чтобы не тянуть за собой bg-in/bg-out,
     которыми помечено наличие товара. */
  .bg-o-new { background: #fff4e0; color: #b36a00; }
  .bg-o-noans { background: #ffeee4; color: #c74a05; }
  .bg-o-later { background: #f0ebff; color: #5f3dc4; }
  .bg-o-appr { background: #e7f7ec; color: #2b8a3e; }
  .bg-o-del { background: #e0f4f7; color: #0b7285; }
  .bg-o-cancel { background: #f4eeee; color: #a13a3a; }
  .bg-grp { background: #fff0f6; color: #a61e4d; }
  .sec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #a5a5a0; margin: 18px 2px 8px; }
  .empty { text-align: center; color: #b5b5b0; font-size: 13px; padding: 40px 20px; line-height: 1.6; }
  .fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--acc); font-size: 30px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,.28); z-index: 6; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 7; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border-radius: 18px 18px 0 0; padding: 18px 16px calc(var(--safe-b) + 18px); z-index: 8; display: none; }
  .sheet h3 { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .sheet label, .lbl { display: block; font-size: 11.5px; font-weight: 800; color: #777; margin: 12px 0 5px; }
  .sheet input, .sheet textarea, .sheet select, .inp { width: 100%; font-family: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; background: #fafaf8; }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; font-weight: 700; }
  .chk input { width: 22px; height: 22px; accent-color: var(--ink); flex-shrink: 0; }
  .save { display: block; width: 100%; margin-top: 16px; background: var(--ink); color: var(--acc); border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800; font-family: inherit; text-align: center; }
  .danger { width: 100%; margin-top: 8px; background: #fdecec; color: #c62828; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; font-family: inherit; }
  .ghost { width: 100%; margin-top: 8px; background: #f0f0ec; color: #444; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; font-family: inherit; }
  .note { font-size: 11.5px; color: #999; line-height: 1.5; margin-top: 8px; }
  .pending { opacity: .55; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 20px); background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; border-radius: 9999px; padding: 10px 20px; z-index: 9; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 88vw; text-align: center; }
  .search { width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid #ddd; border-radius: 12px; outline: none; background: #fff; margin-bottom: 10px; }
  .wrow { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #ebebe7; border-radius: 12px; padding: 10px 14px; margin-bottom: 7px; gap: 10px; }
  .wrow .wc { font-size: 13px; font-weight: 800; color: #0a6e8a; flex-shrink: 0; }
  .wrow .wn { font-size: 12px; color: #666; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .ww { font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .frow { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 2px; border-bottom: 1px solid #f2f2ee; }
  .frow b { font-variant-numeric: tabular-nums; }
  .ftotal { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; padding: 12px 2px 2px; }
  .chip { display: inline-block; border: 1px solid #ddd; background: #fff; border-radius: 9999px; padding: 8px 14px; font-size: 13px; font-weight: 800; color: #777; font-family: inherit; margin: 0 6px 8px 0; }
  .chip.on { background: var(--ink); color: var(--acc); border-color: var(--ink); }
  .chips { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .chip { flex-shrink: 0; }
  .oit { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid #f4f4f0; }
  .oit .n { flex: 1; line-height: 1.35; }
  .oit .q { flex-shrink: 0; color: #777; font-variant-numeric: tabular-nums; text-align: right; }
  .oit .mk { display: block; font-size: 11px; font-weight: 800; margin-top: 2px; }
  .mk-ok { color: #1a8a55; } .mk-no { color: #c62828; } .mk-wait { color: #b46b00; }
  .grpbox { background: #fff7fa; border: 1px solid #f6d3e1; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .grpbox .gh { font-size: 12.5px; font-weight: 800; color: #a61e4d; }
  textarea.codes { width: 100%; font-family: Menlo, monospace; font-size: 14px; padding: 12px; border: 1px solid #ddd; border-radius: 12px; outline: none; background: #fff; min-height: 110px; }
  .res { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #ebebe7; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
  /* ── Звонки (v1.49): «Сегодня позвонить» и заявки ── */
  a.b { display: block; text-align: center; text-decoration: none; line-height: 20px; }
  .b-call { background: #1a8a55; color: #fff; }
  .b-sms { background: #eef3f8; color: #0a6e8a; flex: 0 0 64px; }
  .card.due { border-color: #f3b8b5; box-shadow: inset 4px 0 0 #e53935; }
  .card.k-feed { border-left: 4px solid #f59f00; }
  .card.k-order { border-left: 4px solid #7048e8; }
  .card.k-watch { border-left: 4px solid #1a8a55; }
  .card.k-task { border-left: 4px solid #999; }
  .why { font-size: 13px; color: #444; margin-top: 4px; line-height: 1.45; }
  .why b.due { color: #c62828; }
  .ctx { display: inline-block; font-size: 11px; font-weight: 700; background: #fff8e1; color: #7a5b00; border-radius: 6px; padding: 2px 7px; margin: 5px 4px 0 0; }
  .tcount { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9999px; background: #f59f00; color: #fff; font-size: 11px; line-height: 17px; }
  .stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stbtn { border: 1.5px solid #e6e6e2; background: #fff; border-radius: 10px; padding: 11px 6px; font-size: 13px; font-weight: 800; font-family: inherit; color: #444; min-height: 44px; }
  .stbtn.on { border-color: var(--ink); background: var(--ink); color: var(--acc); }
  .cbchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .cbchips .chip { margin: 0; }
  .err { background: #fff4e0; color: #b46b00; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; line-height: 1.45; }
  /* ── v1.62: нижнее меню, «Ещё», экраны доступа ── */
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: rgba(255,255,255,.97); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 2px 4px calc(var(--safe-b) + 2px); }
  .bnav button { flex: 1 1 0; min-width: 0; height: var(--nav-h); background: none; border: none; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8d8d88; font-size: 10.5px; font-weight: 800; position: relative; }
  .bnav button .ic { font-size: 22px; line-height: 1; }
  .bnav button .tx { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bnav button.on { color: var(--ink); }
  .bnav button.on::before { content: ''; position: absolute; top: 0; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--acc); }
  .nb { position: absolute; top: 4px; left: 50%; margin-left: 5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #e8590c; color: #fff; font-size: 11px; font-weight: 800; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px #fff; }
  .nb.f { background: #f59f00; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { position: relative; background: #f4f4f0; border: none; border-radius: 14px; min-height: 78px; padding: 12px 6px; font-family: inherit; font-weight: 800; font-size: 13px; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .tile .ic { font-size: 25px; line-height: 1; }
  .tile.on { background: var(--ink); color: var(--acc); }
  .tile .nb { top: 6px; left: auto; right: 8px; margin: 0; }
  .gate { text-align: center; padding: 34px 10px 10px; }
  .gate .big { font-size: 46px; line-height: 1; }

  /* iOS 26, приложение с экрана «Домой» (ошибка WebKit 301108): пока страница КОРОЧЕ экрана,
     видимая область короче на высоту строки статуса — нижнее меню «висело» над краем экрана,
     под ним полоса фона (было на коротком экране «Звонки»). Страница всегда не короче экрана —
     и iOS отдаёт полную высоту. min() — чтобы при непрозрачной строке статуса не было прокрутки. */
  @media (display-mode: standalone) {
    html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); }

    .top { padding-top: calc(env(safe-area-inset-top, 0px) + 30px); }
  }

  .sheet { padding-top: 0; max-height: calc(100vh - env(safe-area-inset-top, 0px) - 64px); }

  .sheet-hd .grab { width: 42px; height: 5px; border-radius: 3px; background: #d3dae8; margin-top: 9px; }
  .sheet-hd .sx { position: absolute; right: 12px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: none; background: #eef2fb; color: #233a74; font-size: 16px; font-weight: 800; font-family: inherit; display: flex; align-items: center; justify-content: center; padding: 0; }

  /* открыта клавиатура — нижнее меню и «+» прячем (iPhone иначе таскает их над клавиатурой поверх списка).
     --kbfix: на сколько опустить всё, что прижато к низу экрана, если iOS 26 после закрытия клавиатуры
     оставил меню «висеть» над краем (WebKit 297779). Ставит скрипт — только когда зазор измерен. */
  .bnav, .fab { transition: opacity .18s, visibility .18s; }
  html.kb .bnav, html.kb .fab { opacity: 0; visibility: hidden; pointer-events: none; }
  .bnav { bottom: calc(0px - var(--kbfix, 0px)); }
  .fab { bottom: calc(var(--nav-h) + var(--safe-b) + 16px - var(--kbfix, 0px)); }
  .toast { bottom: calc(var(--nav-h) + var(--safe-b) + 20px - var(--kbfix, 0px)); }
  .sheet, .sheet-bg { bottom: calc(0px - var(--kbfix, 0px)); }

     с правом владельца, и применяет в течение минуты — как кнопки в расширении.
     Своё устройство здесь не меняется; «свои права» по галочкам — только на компьютере. ── */
  var ROLES = [
    { k: 'manager', ic: '👔', t: 'Менеджер', d: 'заказы и статусы, звонки, задачи, наличие, веса, FAN, проверка' },
    { k: 'warehouse', ic: '📦', t: 'Склад', d: 'заказы (просмотр), задачи, наличие, веса, FAN, проверка' },
    { k: 'courier', ic: '🚚', t: 'Курьер', d: 'заказы (просмотр), FAN, поиск товара' },
    { k: 'owner', ic: '👑', t: 'Владелец', d: 'всё, плюс устройства и доступ' }
  ];
  var devRoleOpen = {}, devFocus = '', _devsAfterLoad = null;
  function roleName(k) { var r = ROLES.filter(function (x) { return x.k === k; })[0]; return r ? r.ic + ' ' + L(r.t) : '⚙️ ' + L('Свои права'); }
  function devCode(did) { return String(did || '').slice(0, 6).toUpperCase(); }
  function devList() { return (state && state.devs) || []; }
  function devById(did) { return devList().filter(function (d) { return d && d.did === did; })[0] || null; }
  function devLabel(d) { return (d && (d.nm || d.md)) || ('#' + devCode(d && d.did)); }
  // команда этому устройству, которую компьютер ещё не подтвердил
  function devPend(did) { var q = opsQueue().filter(function (o) { return o.op === 'devSet' && o.did === did; }); return q.length ? q[q.length - 1] : null; }
  // запросы, по которым владелец ещё ничего не решал (для главной и колокольчика)
  function devsWait() { return can('admin') ? devList().filter(function (d) { return d && d.st === 'wait' && !devPend(d.did); }) : []; }
  function devPendText(o) {
    var p = o.patch || {};
    var w = p.st === 'off' ? L('закрыть доступ') : p.st === 'ok' ? L('разрешить как «{r}»', { r: roleName(p.role) }) : L('роль «{r}»', { r: roleName(p.role) });
    return L('Отправлено: {w}. Компьютер применит в течение минуты.', { w: w });
  }
  window.openDevs = function (did) {
    if (!state || !can('admin')) return;
    closeSheets();
    devFocus = did || '';
    document.getElementById('sheetBg').style.display = 'block';
    document.getElementById('devSheet').style.display = 'block';
    devPaint();
    var el = devFocus && document.getElementById('dev-' + devFocus);
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  };
  function devPaint() {
    var el = document.getElementById('devBody'), sh = document.getElementById('devSheet');
    if (!el || !sh || sh.style.display !== 'block') return;
    var my = (state && state.me && state.me.did) || V3.did, rank = { wait: 0, ok: 1, off: 2 };
    var list = devList().filter(Boolean).slice().sort(function (a, b) {
      return ((rank[a.st] != null ? rank[a.st] : 3) - (rank[b.st] != null ? rank[b.st] : 3)) || (a.st === 'wait' ? (b.first || 0) - (a.first || 0) : (b.last || 0) - (a.last || 0));
    });
    var h = '<h3>' + esc(L('Устройства и доступ')) + '</h3>';
    if (state && state.updatedAt && Date.now() - state.updatedAt > 20 * 60000) h += '<div class="err">' + esc(L('Компьютер давно не на связи — команды применятся, когда он включится.')) + '</div>';
    if (!list.length) h += '<div class="empty">' + esc(L('Устройств пока нет')) + '</div>';
    h += list.map(function (d) { return devCard(d, d.did === my); }).join('');
    var vis = ((state && state.visits) || []).slice().reverse();
    if (vis.length) h += '<details class="dvis"><summary>' + esc(L('👣 Кто заходил — последние {n}', { n: vis.length })) + '</summary>' + vis.map(function (v) {
      var d = devById(v.did);
      return '<div class="vr"><b>' + esc(d ? devLabel(d) : (v.nm || '#' + devCode(v.did))) + '</b> · ' + esc(agoText(v.at)) + '<br>' + esc([[v.ci, v.co].filter(Boolean).join(', '), v.ip ? 'IP ' + v.ip : ''].filter(Boolean).join(' · ') || '—') + '</div>';
    }).join('') + '</details>';
    h += '<div class="note">' + esc(L('Новое устройство появляется здесь, когда сотрудник откроет ссылку и введёт имя. Сверь код на его экране с кодом здесь. «Свои права» по галочкам — в расширении на компьютере.')) + '</div>';
    el.innerHTML = h;
  }
  function devCard(d, mine) {
    var id = esc(d.did), p = devPend(d.did), wait = d.st === 'wait';
    var pill = mine ? '<span class="pill bg-in">' + esc(L('это устройство')) + '</span>'
      : d.st === 'ok' ? '<span class="pill bg-in">' + esc(roleName(d.role)) + '</span>'
      : d.st === 'off' ? '<span class="pill bg-out">' + esc(L('доступ закрыт')) + '</span>'
      : '<span class="pill bg-unk">' + esc(L('ждёт разрешения')) + '</span>';
    var when = wait ? (d.first ? L('просит доступ {t}', { t: agoText(d.first) }) : '') : (d.last ? L('был(а) {t}', { t: agoText(d.last) }) : '');
    var meta = [d.md && d.md !== d.nm ? d.md : '', [d.ci, d.co].filter(Boolean).join(', '), d.ip ? 'IP ' + d.ip : '', when].filter(Boolean).join(' · ');
    var h = '<div class="dcard ' + esc(d.st || 'wait') + (devFocus === d.did ? ' focus' : '') + '" id="dev-' + id + '">'
      + '<div class="dtop"><b>' + esc(devLabel(d)) + '</b>' + pill + '</div>'
      + '<div class="note" style="margin-top:3px;">' + esc(meta) + (d.push ? ' · 🔔' : '') + '</div>';
    if (d.st === 'ok' && Array.isArray(d.pm)) h += '<div class="note" style="margin-top:2px;">' + esc(d.pm.map(function (x) { return L(PERM_T[x] || x); }).join(', ')) + '</div>';
    if (wait) h += '<div class="dkey">' + esc(L('Код')) + ':<b>' + esc(devCode(d.did)) + '</b>' + esc(L('— сверь с экраном его телефона')) + '</div>';
    if (mine) return h + '</div>';
    if (p) return h + '<div class="dpend">⏳ ' + esc(devPendText(p)) + '</div></div>';
    if (d.st === 'ok') {
      h += '<div class="drow"><button class="chip" onclick="devRoleToggle(\'' + id + '\')">' + esc(L('Сменить роль')) + ' ' + (devRoleOpen[d.did] ? '▴' : '▾') + '</button>'
        + '<button class="chip dno" onclick="devBlock(\'' + id + '\')">' + esc(L('⛔ Закрыть доступ')) + '</button></div>';
      if (devRoleOpen[d.did]) h += devRoles(d, 'role');
    } else {
      h += '<div class="dlbl">' + esc(L(wait ? 'Разрешить как:' : 'Вернуть доступ как:')) + '</div>' + devRoles(d, 'ok');
      if (wait) h += '<button class="danger" onclick="devBlock(\'' + id + '\')">' + esc(L('⛔ Отклонить')) + '</button>';
    }
    return h + '</div>';
  }
  function devRoles(d, mode) {
    return '<div class="droles">' + ROLES.map(function (r) {
      var cur = mode === 'role' && d.role === r.k;
      return '<button class="drole' + (cur ? ' on' : '') + '" onclick="devAct(\'' + esc(d.did) + '\', \'' + mode + '\', \'' + r.k + '\')"><span class="rt">' + r.ic + ' ' + esc(L(r.t)) + (cur ? ' ✓' : '') + '</span><span class="rd">' + esc(L(r.d)) + '</span></button>';
    }).join('') + '</div>';
  }
  window.devRoleToggle = function (did) { devRoleOpen[did] = !devRoleOpen[did]; devPaint(); };
  // разрешить (mode 'ok') или сменить роль (mode 'role'); владельцу — с отдельным предупреждением
  window.devAct = function (did, mode, role) {
    var d = devById(did);
    if (!d || !can('admin') || !ROLES.some(function (r) { return r.k === role; })) return;
    if (mode === 'role' && d.role === role) { devRoleOpen[did] = false; devPaint(); return; }
    var q = mode === 'ok' ? L('Разрешить доступ «{n}» (код {c}) как «{r}»?', { n: devLabel(d), c: devCode(did), r: roleName(role) })
      : L('Сменить роль «{n}» на «{r}»?', { n: devLabel(d), r: roleName(role) });
    if (role === 'owner') q += '\n\n' + L('Владелец видит всё и сам разрешает устройства и меняет роли.');
    if (!confirm(q)) return;
    opPush({ op: 'devSet', did: did, patch: mode === 'ok' ? { st: 'ok', role: role } : { role: role } });
    devRoleOpen[did] = false;
    devAfter();
  };
  // отклонить запрос / закрыть доступ
  window.devBlock = function (did) {
    var d = devById(did);
    if (!d || !can('admin')) return;
    if (!confirm(d.st === 'wait' ? L('Отклонить запрос «{n}»? Устройство не получит доступ (передумаешь — «Вернуть доступ» здесь же).', { n: devLabel(d) })
      : L('Закрыть доступ «{n}»? Данные на нём удалятся, команды с него выполняться не будут.', { n: devLabel(d) }))) return;
    opPush({ op: 'devSet', did: did, patch: { st: 'off' } });
    devAfter();
  };
  function devAfter() {
    devPaint(); bellPaint();
    if (tab === 'home' && !typingNow()) heroPaint('home');
    toast(L('✓ Отправлено — компьютер применит в течение минуты'));
  }
  window.closeSheets = function () { ['sheetBg', 'editSheet', 'cfgSheet', 'feedSheet', 'moreSheet', 'bellSheet', 'devSheet'].forEach(function (i) { var el = document.getElementById(i); if (el) { el.style.display = 'none'; el.style.translate = ''; } }); fdSel = null; };
  /* v1.63.1: у каждого всплывающего окна — шапка с «ручкой» и кнопкой ✕ (она не уезжает при
     прокрутке окна); окно можно смахнуть вниз за шапку. Раньше закрыть можно было только
     тапом мимо окна, а на iPhone над длинным окном почти не оставалось места. */
  function sheetChrome() {
    Array.prototype.forEach.call(document.querySelectorAll('.sheet'), function (sh) {
      if (sh.querySelector('.sheet-hd')) return;
      var hd = document.createElement('div');
      hd.className = 'sheet-hd';
      hd.innerHTML = '<span class="grab"></span><button type="button" class="sx" aria-label="close" onclick="closeSheets()">✕</button>';
      sh.insertBefore(hd, sh.firstChild);
      var y0 = null, dy = 0;
      hd.addEventListener('touchstart', function (e) { if (e.target.closest && e.target.closest('.sx')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
      hd.addEventListener('touchmove', function (e) { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.translate = dy ? ('0 ' + dy + 'px') : ''; }, { passive: true });
      hd.addEventListener('touchend', function () {
        if (y0 == null) return;
        y0 = null; sh.style.transition = 'translate .18s ease-out';
        if (dy > 70) closeSheets(); else sh.style.translate = '';
      }, { passive: true });
    });
  }

  /* ── запуск: ссылка → ключ устройства → имя → визит + приветствие → данные ── */
  var _pollT = null;
  function start() {
    render();
    // мгновенно — последний снимок (он хранится зашифрованным)
    var cached = null; try { cached = JSON.parse(localStorage.getItem('vp_box') || 'null'); } catch (e) { cached = null; }
    var pre = (cached && cached.ct && localStorage.getItem('vp_g')) ? boxOpen(cached, 'state').then(function (s) { if (!state) applyState(s); }, function () {}) : Promise.resolve();
    pre.then(function () {
      return noteVisit().then(function (fresh) {
        var wrote = +(localStorage.getItem('vp_wrote') || 0);
        // v1.66: и когда компьютер ещё не получил секрет восстановления этого ключа
        if (fresh || opsQueue().length || Date.now() - wrote > 6 * 3600000 || lsGet('vp_rec_did') !== V3.did) {
          return swReady().then(function () { return devWrite(); }).catch(function () {});
        }
      });
    }).then(function () { window.refresh(true); });
    swReady().then(function () { if (document.getElementById('cfgSheet').style.display === 'block') cfgPaint(); });
    if (!_pollT) _pollT = setInterval(function () {
      if (document.hidden || !cfg || !V3.aes) return;
      var gap = V3.st === 'ok' ? 60000 : 20000;
      if (Date.now() - _lastRef >= gap) window.refresh(true);
    }, 5000);
  }
  function boot() {
    sheetChrome();
    applyStatic();
    loadCfg();
    if (!cfg) { render(); return; }
    if (!cryptoOk()) { gate('nocrypto'); return; }
    if (!V3.rekey && lsGet('vp_rekey')) V3.rekey = lsGet('vp_rekey');
    devKeys({ fresh: V3.fresh }).then(function (rec) {
      V3.priv = rec.priv; V3.pub = rec.pub;
      return didOf(rec.pub);
    }).then(function (did) {
      V3.did = did;
      // v1.66: ключ не тот, что в прошлый раз — данные под прежний не открыть; доступ вернёт компьютер
      var prev = lsGet('vp_did');
      if (prev && prev !== did) rekeyMark('key');
      lsSet('vp_did', did);
      return deriveAes(V3.priv, cfg.c);
    }).then(function (k) {
      V3.aes = k;
      if (!devName()) { gate(needInstall() ? 'install' : 'name'); return; }
      start();
    }).catch(function (e) {
      if (e && e.busy) { idbBusy(); return; }
      gate('err', L('ключ устройства не создался') + ': ' + ((e && e.message) || e));
    });
  }
  // v1.66: база ключей не ответила, а телефон уже был подключён. Сначала один перезапуск (сбой WebKit
  // «соединение с базой потеряно» проходит только так); не помогло — новый ключ, компьютер узнает телефон.
  function idbBusy() {
    var at = -1; try { at = +(sessionStorage.getItem('vp_idb_rl') || 0); } catch (e) { at = -1; }
    if (at >= 0 && Date.now() - at > 120000) {
      try { sessionStorage.setItem('vp_idb_rl', String(Date.now())); } catch (e) {}
      gate('busy');
      setTimeout(function () { (window.__veReload || function () { location.reload(); })(); }, 1200);
      return;
    }
    V3.fresh = true;
    boot();
  }
  window.__veV3 = V3;   // для проверок
  window.__veBoot = boot;   // v1.66: проверки — «перезапуск» приложения
  window.__veState = function () { return state; };
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !cfg || !V3.aes) return;
    if (FW && FW.st !== 'done') { if (FW.st === 'slow') fwTick(true); else fwPlan(50); }   // v1.67: вернулись в приложение — сразу проверить ответ
    if (owActive().length) owPlan(50); else if (Object.keys(OW).some(function (k) { return OW[k].st === 'slow'; })) owTick(true);   // v1.67.1
    noteVisit().then(function (fresh) { if (fresh) devWrite().catch(function () {}); });
    if (Date.now() - _lastRef > 8000) window.refresh(true);
    // Вернулись после звонка клиенту по заявке — сразу лист «что получилось».
    var lc = null; try { lc = JSON.parse(localStorage.getItem('vp_lastcall') || 'null'); } catch (e) { lc = null; }
    if (lc && lc.id && (Date.now() - lc.at) > 4000 && (Date.now() - lc.at) < 30 * 60000) {
      try { localStorage.removeItem('vp_lastcall'); } catch (e) {}
      setTimeout(function () { if (state && !fdSel) fdOpen(lc.id); }, 900);
    }
  });
  // сообщения от сервис-воркера: пришло уведомление / открыли уведомление
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.vp === 'push') setTimeout(function () { window.refresh(true); }, 1500);
    if (d.vp === 'open' && d.tab) {
      if (d.tab === 'devs') { openDevs(String(d.id || '')); window.refresh(true); }   // v1.64: «просит доступ»
      else if (d.tab === 'orders' && d.id) fdOrder(parseInt(d.id, 10) || 0); else setTab(d.tab);
    }
  });
  boot();
})();
</script>
